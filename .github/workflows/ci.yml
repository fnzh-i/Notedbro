name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'fnzh-i/Notedbro'
    name: validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version:
          - "3.9"
          - "3.15"
    env:
      BRAIN_VAULT: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check runtime manifest
        run: python _Scripts/build-runtime-manifest --check

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes age zstd

      - name: Install macOS backup dependencies
        if: runner.os == 'macOS'
        run: brew install age zstd

      - name: Check release candidate
        if: runner.os != 'Windows'
        run: python _Scripts/check-release

      - name: Run Windows repository validators
        if: runner.os == 'Windows'
        run: |
          python _Scripts/check-collaboration
          python _Scripts/check-file-session
          python _Scripts/check-provenance-tags
          python _Scripts/check-vault

      - name: Check Windows Ship and release integrity
        if: runner.os == 'Windows'
        run: |
          python _Scripts/check-migration verify-baseline
          python _Scripts/ship self-check
          python _Scripts/publish self-check
